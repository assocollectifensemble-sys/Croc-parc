<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img" aria-label="Un animal du parc — visuel d'attente">
  <!-- VISUEL D'ATTENTE — À REMPLACER PAR UNE VRAIE PHOTO.
       Vignette — maki catta, paon bleu, tortue ou crocodile
       Voir maitai/README.md § « Remplacer les images » et docs/CREDITS.md. -->
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#22402E"/>
      <stop offset="55%" stop-color="#17281D"/>
      <stop offset="100%" stop-color="#0E1A13"/>
    </linearGradient>
    <pattern id="p" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M60 8c22 16 30 40 22 62-8 22-30 34-52 30 4-24 14-44 30-62z" fill="#3B6B4A" opacity=".22"/>
      <path d="M60 8c-2 30 2 56 12 92" stroke="#7FA86A" stroke-width="2" fill="none" opacity=".2"/>
    </pattern>
  </defs>

  <rect width="700" height="700" fill="url(#f)"/>
  <rect width="700" height="700" fill="url(#p)"/>

  <g transform="translate(350 350)" text-anchor="middle">
    <g transform="translate(0 -98.8)">
      <circle r="34" fill="none" stroke="#7FA86A" stroke-width="2" opacity=".55"/>
      <path d="M0 20V-14M0 -6c-8-8-17-10-24-9 .9 8 5 14 12 17 4 1.6 8 1.6 12 .6zM0 -6c8-8 17-10 24-9-.9 8-5 14-12 17-4 1.6-8 1.6-12 .6z"
            stroke="#7FA86A" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <text y="0" fill="#F7F2E7" font-family="Georgia, serif" font-size="38" font-style="italic">Un animal du parc</text>
    <text y="72.2" fill="#7FA86A" font-family="system-ui, sans-serif" font-size="16.72" letter-spacing="2.5">VISUEL D'ATTENTE — À REMPLACER</text>
  </g>
</svg>
