<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le Maï-Taï — Réouverture — Direction Sous la Varangue — Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,900;1,600&family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root{
    --brown-dark:#241811;
    --brown-mid:#4A3626;
    --green-forest:#24331D;
    --terracotta:#B5432B;
    --cream:#F5EEDF;
    --gold:#C89B3C;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--cream);
    position:relative;
  }

  /* ===== Bande haute (zone masquée par l'UI Instagram — décorative uniquement) ===== */
  .top-safe{
    height:250px;
    background:var(--green-forest);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .top-safe svg{opacity:0.55;}

  /* ===== Bande photo ===== */
  .photo-band{
    position:relative;
    width:1080px;
    height:900px;
    overflow:hidden;
  }
  .photo-band img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:50% 18%;
    filter:grayscale(0.35) contrast(1.08) brightness(0.95);
  }
  .photo-band .tint{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(36,25,17,0.4) 0%, rgba(36,25,17,0.05) 30%, rgba(36,51,29,0.55) 100%);
    mix-blend-mode:multiply;
  }
  .photo-band .fade-bottom{
    position:absolute;left:0;right:0;bottom:0;height:260px;
    background:linear-gradient(180deg, rgba(245,238,223,0) 0%, var(--cream) 92%);
  }

  .logo-lockup{
    position:absolute;
    top:44px;left:56px;
    display:flex;
    align-items:center;
    gap:14px;
    color:var(--cream);
    z-index:5;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,0.45));
  }
  .bamboo{display:block;}
  .logo-text{display:flex;flex-direction:column;line-height:0.85;}
  .logo-text .maitai{
    font-family:'Permanent Marker',cursive;
    font-size:40px;
    letter-spacing:0.5px;
  }
  .logo-text .restaurant{
    font-family:'Barlow Semi Condensed',sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:5px;
    margin-top:6px;
  }

  /* ===== Panneau texte ===== */
  .panel{
    position:relative;
    padding:0 72px;
    color:var(--brown-dark);
  }
  .kicker{
    font-family:'Barlow Semi Condensed',sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--terracotta);
    margin-top:8px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:900;
    font-style:italic;
    font-size:150px;
    line-height:0.86;
    letter-spacing:-2px;
    margin-top:10px;
    color:var(--brown-dark);
  }
  .date{
    font-family:'Barlow Semi Condensed',sans-serif;
    font-weight:700;
    font-size:52px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--terracotta);
    margin-top:10px;
  }

  .details{
    margin-top:34px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .details .row{
    display:flex;
    align-items:flex-start;
    gap:14px;
    font-size:25px;
    font-weight:500;
    color:var(--brown-mid);
  }
  .details svg{flex:none;margin-top:3px;color:var(--terracotta);}
  .details b{color:var(--brown-dark);font-weight:600;}

  .cta{
    margin-top:32px;
    display:inline-flex;
    align-items:center;
    gap:14px;
    background:var(--terracotta);
    color:var(--cream);
    padding:18px 32px;
    border-radius:100px;
  }
  .cta svg{flex:none;}
  .cta .label{
    font-family:'Barlow Semi Condensed',sans-serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.5px;
  }
  .cta .num{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.5px;
  }

  /* ===== Bande basse (zone masquée par l'UI Instagram — décorative uniquement) ===== */
  .bottom-safe{
    position:absolute;
    left:0;right:0;bottom:0;
    height:250px;
    background:var(--terracotta);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .bottom-safe svg{opacity:0.5;}
</style>
</head>
<body>

  <div class="top-safe">
    <svg width="140" height="18" viewBox="0 0 140 18" fill="none">
      <path d="M0 9h50M90 9h50" stroke="#F5EEDF" stroke-width="2"/>
      <path d="M63 2 L60 16" stroke="#F5EEDF" stroke-width="4" stroke-linecap="round"/>
      <path d="M77 2 L80 16" stroke="#F5EEDF" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="photo-band">
    <img src="../../assets/source/venue-terrasse-original.jpg" alt="">
    <div class="tint"></div>
    <div class="fade-bottom"></div>

    <div class="logo-lockup">
      <svg class="bamboo" width="14" height="62" viewBox="0 0 14 62" fill="none">
        <path d="M7 2 L5 60" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
        <path d="M1 18 L13 15" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M0 40 L12 37" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <div class="logo-text">
        <span class="maitai">Maï-Taï</span>
        <span class="restaurant">RESTAURANT</span>
      </div>
      <svg class="bamboo" width="14" height="62" viewBox="0 0 14 62" fill="none">
        <path d="M7 2 L9 60" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
        <path d="M13 18 L1 15" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M14 40 L2 37" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="panel">
    <div class="kicker">Après les vacances scolaires</div>
    <h1>On rouvre</h1>
    <div class="date">Mardi 18 août</div>

    <div class="details">
      <div class="row">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2.2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <div>Ouvert <b>du mardi au vendredi</b> — fermé le lundi</div>
      </div>
      <div class="row">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v5l3.2 2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <div><b>Samedi &amp; dimanche</b> sur réservation — entrée principale CrocParc</div>
      </div>
      <div class="row">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <div>Menu à <b>26&nbsp;€</b> — entrée, plat, dessert — places limitées</div>
      </div>
    </div>

    <div class="cta">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.7 21 3 13.3 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z" fill="currentColor"/></svg>
      <span class="label">Réservations</span>
      <span class="num">06 92 39 42 00</span>
    </div>
  </div>

  <div class="bottom-safe">
    <svg width="140" height="18" viewBox="0 0 140 18" fill="none">
      <path d="M0 9h50M90 9h50" stroke="#F5EEDF" stroke-width="2"/>
      <path d="M63 2 L60 16" stroke="#F5EEDF" stroke-width="4" stroke-linecap="round"/>
      <path d="M77 2 L80 16" stroke="#F5EEDF" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>

</body>
</html>
