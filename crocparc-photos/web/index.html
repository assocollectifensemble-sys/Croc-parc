<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vos photos - Croc Parc</title>
    <meta name="description" content="Retrouvez les photos de votre visite au Croc Parc avec le code de votre carte." />
    <meta name="theme-color" content="#2f6b4f" />
    <!-- Une galerie ne doit jamais se retrouver dans un moteur de recherche. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icone.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icone-192.png" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="contenu accueil">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7a1 1 0 0 0 .84-.46l.92-1.42A1 1 0 0 1 9.8 3.7h4.4a1 1 0 0 1 .84.42l.92 1.42a1 1 0 0 0 .84.46h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z" />
        <circle cx="12" cy="12.5" r="3.6" />
      </svg>

      <h1>Vos photos de visite</h1>
      <p class="aide">
        Saisissez le code a six caracteres inscrit sur la carte que la photographe
        vous a remise.
      </p>

      <form class="saisie" id="formulaire" novalidate>
        <label class="sr-only" for="code">Code de votre carte</label>
        <input
          id="code"
          name="code"
          type="text"
          inputmode="latin"
          autocomplete="off"
          autocapitalize="characters"
          autocorrect="off"
          spellcheck="false"
          maxlength="6"
          placeholder="K7M2QP"
          aria-describedby="message"
        />
        <p class="message" id="message" role="status" aria-live="polite"></p>
        <button class="bouton" type="submit" id="valider" disabled>Voir mes photos</button>
      </form>

      <p class="pied-page">
        Vos photos restent disponibles 30 jours apres votre visite, puis sont
        effacees.<br />
        Une question&nbsp;? <a href="mailto:photos@crocparc.re">photos@crocparc.re</a>
      </p>
    </main>

    <script type="module" src="/js/index.js"></script>
  </body>
</html>
