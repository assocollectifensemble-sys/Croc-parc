<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Le Maï-Taï — Nou artourne ! (Story)</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Fraunces'; font-style: italic; font-weight: 700; src: url('assets/fonts/fraunces-700-italic.woff2') format('woff2'); }
      @font-face { font-family: 'Barlow Semi Condensed'; font-weight: 600; src: url('assets/fonts/barlow-600.woff2') format('woff2'); }
      @font-face { font-family: 'Barlow Semi Condensed'; font-weight: 700; src: url('assets/fonts/barlow-700.woff2') format('woff2'); }
      @font-face { font-family: 'Permanent Marker'; font-weight: 400; src: url('assets/fonts/permanent-marker-400.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 400; src: url('assets/fonts/inter-400.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 500; src: url('assets/fonts/inter-500.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 700; src: url('assets/fonts/inter-700.woff2') format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; background: #F5EEDF; }
      body { font-family: 'Inter', sans-serif; }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F5EEDF;
      }

      /* ---- bandeaux de sécurité (haut/bas) ---- */
      #top-safe, #bottom-safe {
        position: absolute;
        left: 0; width: 1080px; height: 250px;
        display: flex; align-items: center; justify-content: center;
      }
      #top-safe { top: 0; background: #24331D; }
      #bottom-safe { top: 1670px; background: #B5432B; }
      .safe-mark path { stroke: #F5EEDF; }

      /* ---- photo ---- */
      #photo-band {
        position: absolute; top: 250px; left: 0;
        width: 1080px; height: 840px;
        overflow: hidden;
      }
      #photo-img {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        object-fit: cover; object-position: 50% 18%;
        filter: saturate(1.2) contrast(1.05) brightness(1.03);
        transform-origin: center center;
      }
      #photo-tint {
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(200,155,60,0.10) 0%, rgba(200,155,60,0.02) 30%, rgba(181,67,43,0.28) 100%);
        mix-blend-mode: multiply;
      }
      #photo-fade {
        position: absolute; left: 0; right: 0; bottom: 0; height: 260px;
        background: linear-gradient(180deg, rgba(245,238,223,0) 0%, #F5EEDF 92%);
      }

      /* ---- logo ---- */
      #logo {
        position: absolute; top: 294px; left: 56px;
        display: flex; flex-direction: column; gap: 9px;
        color: #F5EEDF;
        filter: drop-shadow(0 2px 10px rgba(0,0,0,0.45));
      }
      #logo .row { display: flex; align-items: center; gap: 14px; }
      #logo .logo-text { display: flex; flex-direction: column; line-height: 0.85; }
      #logo .maitai { font-family: 'Permanent Marker', cursive; font-size: 40px; }
      #logo .restaurant { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 5px; margin-top: 6px; }
      #logo .croc-row { display: flex; align-items: center; gap: 8px; opacity: 0.95; }
      #logo .croc-row span { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }

      /* ---- texte ---- */
      #kicker {
        position: absolute; top: 1104px; left: 72px;
        font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 26px;
        letter-spacing: 4px; text-transform: uppercase; color: #B5432B;
      }
      #headline-halo {
        position: absolute; top: 1122px; left: 8px; width: 1040px; height: 220px;
        background: radial-gradient(ellipse at 32% 50%, rgba(181,67,43,0.30) 0%, rgba(181,67,43,0.14) 45%, rgba(181,67,43,0) 72%);
        filter: blur(10px);
      }
      #headline {
        position: absolute; top: 1148px; left: 72px; width: 960px;
        font-family: 'Fraunces', serif; font-weight: 700; font-style: italic;
        font-size: 122px; line-height: 0.94; letter-spacing: -1.5px;
        color: #241811;
        text-shadow: 4px 4px 0 rgba(200,155,60,0.35), 8px 8px 0 rgba(181,67,43,0.16);
      }
      #scribble { position: absolute; top: 1280px; left: 76px; width: 230px; height: 17px; }
      #scribble path { stroke: #C89B3C; }

      #sticker {
        position: absolute; top: 1315px; left: 72px;
        display: inline-flex; align-items: center;
        background: #B5432B; color: #F5EEDF;
        border: 4px solid #F5EEDF; border-radius: 100px;
        padding: 10px 30px;
        box-shadow: 0 8px 18px rgba(36,25,17,0.3);
        font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 38px;
        letter-spacing: 0.5px; text-transform: uppercase;
        transform-origin: center center;
      }

      .detail-row {
        position: absolute; left: 72px;
        display: flex; align-items: flex-start; gap: 14px;
        font-size: 30px; font-weight: 500; color: #4A3626;
      }
      .detail-row svg { flex: none; margin-top: 3px; color: #B5432B; }
      .detail-row b { color: #241811; font-weight: 600; }
      #detail1 { top: 1415px; }
      #detail2 { top: 1459px; }
      #detail3 { top: 1503px; }

      #cta {
        position: absolute; top: 1563px; left: 72px;
        display: inline-flex; align-items: center; gap: 14px;
        background: #B5432B; color: #F5EEDF;
        padding: 18px 32px; border-radius: 100px;
        font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 32px;
        transform-origin: center center;
      }
      #cta .num { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 32px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6"
    >
      <div id="photo-band" class="clip" data-start="0" data-duration="6.0" data-track-index="0" data-layout-allow-overflow="true">
        <img id="photo-img" src="assets/venue-terrasse.jpg" alt="" />
        <div id="photo-tint"></div>
        <div id="photo-fade"></div>
      </div>

      <div id="top-safe" class="clip" data-start="0" data-duration="6.0" data-track-index="1">
        <svg class="safe-mark" width="140" height="18" viewBox="0 0 140 18" fill="none">
          <path d="M0 9h50M90 9h50" stroke-width="2"/>
          <path d="M63 2 L60 16" stroke-width="4" stroke-linecap="round"/>
          <path d="M77 2 L80 16" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>

      <div id="bottom-safe" class="clip" data-start="0" data-duration="6.0" data-track-index="2">
        <svg class="safe-mark" width="140" height="18" viewBox="0 0 140 18" fill="none">
          <path d="M0 9h50M90 9h50" stroke-width="2"/>
          <path d="M63 2 L60 16" stroke-width="4" stroke-linecap="round"/>
          <path d="M77 2 L80 16" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>

      <div id="logo" class="clip" data-start="0.15" data-duration="5.85" data-track-index="3">
        <div class="row">
          <svg width="14" height="62" viewBox="0 0 14 62" fill="none">
            <path d="M7 2 L5 60" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
            <path d="M1 18 L13 15" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M0 40 L12 37" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
          <div class="logo-text">
            <span class="maitai">Maï-Taï</span>
            <span class="restaurant">RESTAURANT</span>
          </div>
          <svg width="14" height="62" viewBox="0 0 14 62" fill="none">
            <path d="M7 2 L9 60" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
            <path d="M13 18 L1 15" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M14 40 L2 37" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="croc-row">
          <svg width="70" height="18" viewBox="0 0 120 30" fill="currentColor">
            <ellipse cx="58" cy="16" rx="42" ry="7"/>
            <polygon points="18,16 0,10 0,22"/>
            <polygon points="98,16 120,11 120,21"/>
            <polygon points="34,9 39,1 44,9"/>
            <polygon points="50,9 55,1 60,9"/>
            <polygon points="66,9 71,1 76,9"/>
            <rect x="30" y="21" width="3" height="7" rx="1"/>
            <rect x="42" y="22" width="3" height="7" rx="1"/>
            <rect x="72" y="22" width="3" height="7" rx="1"/>
            <rect x="84" y="21" width="3" height="7" rx="1"/>
          </svg>
          <span>By Croc Parc</span>
        </div>
      </div>

      <div id="kicker" class="clip" data-start="0.55" data-duration="5.45" data-track-index="4">Après les vacances scolaires</div>

      <div id="headline-halo" class="clip" data-start="0.9" data-duration="5.1" data-track-index="5"></div>

      <h1 id="headline" class="clip" data-start="0.9" data-duration="5.1" data-track-index="6">Nou artourne !</h1>

      <svg id="scribble" class="clip" data-start="1.6" data-duration="4.4" data-track-index="7" viewBox="0 0 230 17" fill="none">
        <path d="M3 10c22-9 44-9 60-3s38 8 60 1 49-7 65 1 27 3 37-2" stroke-width="4.5" stroke-linecap="round"/>
      </svg>

      <div id="sticker" class="clip" data-start="2.2" data-duration="3.8" data-track-index="8">Mardi 18 août</div>

      <div id="detail1" class="detail-row clip" data-start="2.75" data-duration="3.25" data-track-index="9">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2.2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span>Ouvert <b>du mardi au vendredi</b> — fermé le lundi</span>
      </div>
      <div id="detail2" class="detail-row clip" data-start="3.0" data-duration="3.0" data-track-index="10">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v5l3.2 2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span><b>Samedi &amp; dimanche</b> sur réservation — entrée principale CrocParc</span>
      </div>
      <div id="detail3" class="detail-row clip" data-start="3.25" data-duration="2.75" data-track-index="11">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span>Menu à <b>26&nbsp;€</b> — entrée, plat, dessert — places limitées</span>
      </div>

      <div id="cta" class="clip" data-start="3.65" data-duration="2.35" data-track-index="12">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.7 21 3 13.3 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z" fill="currentColor"/></svg>
        <span>Réservations</span>
        <span class="num">06 92 39 42 00</span>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Ken Burns lent sur la photo — seul le mouvement de caméra, rien d'autre.
      tl.fromTo('#photo-img', { scale: 1.08 }, { scale: 1, duration: 8, ease: 'none' }, 0);

      tl.from('#logo', { opacity: 0, y: -16, duration: 0.7, ease: 'power2.out' }, 0.15);
      tl.from('#kicker', { opacity: 0, y: 18, duration: 0.6, ease: 'power2.out' }, 0.55);
      tl.from('#headline-halo', { opacity: 0, duration: 0.65, ease: 'power1.out' }, 0.9);
      tl.fromTo('#headline', { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.65, ease: 'back.out(1.6)' }, 0.9);
      tl.fromTo('#scribble path', { strokeDasharray: 320, strokeDashoffset: 320 }, { strokeDashoffset: 0, duration: 0.7, ease: 'power2.out' }, 1.6);

      tl.fromTo('#sticker', { opacity: 0, scale: 0.4, rotation: -3 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.6, ease: 'back.out(1.8)' }, 2.2);
      tl.to('#sticker', { scale: 1.05, duration: 0.55, ease: 'sine.inOut', yoyo: true, repeat: 4 }, 2.9);

      tl.from('#detail1', { opacity: 0, y: 18, duration: 0.5, ease: 'power2.out' }, 2.75);
      tl.from('#detail2', { opacity: 0, y: 18, duration: 0.5, ease: 'power2.out' }, 3.0);
      tl.from('#detail3', { opacity: 0, y: 18, duration: 0.5, ease: 'power2.out' }, 3.25);

      tl.fromTo('#cta', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.8)' }, 3.65);
      tl.to('#cta', { scale: 1.04, duration: 0.55, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 4.4);

      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
