[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crocparc-bridge"
version = "0.1.0"
description = "Pont local Croc Parc Photos : FTP Sony A7 IV -> tri par carte QR -> previews filigranees -> stockage"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "piexif>=1.1.3",
    "pyzbar>=0.1.9",
    "watchdog>=3.0",
]

[project.optional-dependencies]
# Depot des previews sur R2 (BRIDGE_STORAGE_BACKEND=r2).
cloud = ["boto3>=1.34"]
# Fixtures de test (cartes QR synthetiques) et serveur S3 simule.
dev = ["pytest>=8.0", "qrcode>=7.4", "boto3>=1.34", "moto[server]>=5.0"]

[project.scripts]
crocparc-bridge = "bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:bridge.*"]
