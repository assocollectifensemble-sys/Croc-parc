name: Déployer le site Maï-Taï sur GitHub Pages

# Publie UNIQUEMENT le dossier /maitai sur GitHub Pages.
# Le reste du dépôt (skills Claude Code, etc.) n'est jamais publié.
#
# ⚠️ UNE ACTION MANUELLE EST REQUISE, UNE SEULE FOIS :
#   Settings → Pages → Build and deployment → Source : « GitHub Actions »
#
# Le job tente bien d'activer Pages tout seul (enablement: true), mais sur ce
# dépôt GitHub le refuse : le GITHUB_TOKEN d'un workflow n'a pas le droit de
# CRÉER un site Pages (« Create Pages site failed. Error: Resource not
# accessible by integration »). Il faut des droits d'administration sur le
# dépôt, que seul un humain possède ici.
#
# Une fois Pages activé, l'option enablement: true devient sans effet : l'action
# constate que le site existe et poursuit. Il n'y a plus rien à faire ensuite,
# chaque push redéploie automatiquement.

on:
  push:
    branches:
      # Branche par défaut actuelle du dépôt. Elle porte un nom hérité d'une
      # session précédente ; si vous la renommez un jour en « main », la ligne
      # suivante suffit et celle-ci peut disparaître.
      - claude/skill-installation-1agmce
      - main
    paths:
      - 'maitai/**'
      - '.github/workflows/deploy-maitai.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaqueter le dossier maitai
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./maitai

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
