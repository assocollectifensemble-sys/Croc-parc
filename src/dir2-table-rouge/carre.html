<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le Maï-Taï — Réouverture — Direction Table Rouge — Carré</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181512;
    --paper:#FAF6EF;
    --red:#C1272D;
    --yellow:#F2A93B;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1080px;overflow:hidden;}
  body{
    font-family:'Space Grotesk',sans-serif;
    background:var(--ink);
    color:var(--paper);
    position:relative;
    padding:64px 72px;
    display:flex;
    flex-direction:column;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand .label{
    font-weight:700;
    font-size:24px;
    letter-spacing:6px;
    text-transform:uppercase;
  }
  .brand .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--red);
  }
  .brand .place{
    font-weight:500;
    font-size:20px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#9C948B;
  }

  .headline-wrap{
    margin-top:70px;
  }
  .stamp{
    display:inline-block;
    background:var(--red);
    color:var(--paper);
    padding:6px 26px 16px;
    transform:rotate(-1.6deg);
  }
  h1{
    font-family:'Archivo Black',sans-serif;
    font-size:172px;
    line-height:0.86;
    letter-spacing:-2px;
    text-transform:uppercase;
  }
  .date{
    margin-top:34px;
    font-family:'Archivo Black',sans-serif;
    font-size:56px;
    letter-spacing:0px;
    color:var(--red);
    text-transform:uppercase;
  }

  .rule{
    margin-top:32px;
    height:2px;
    width:100%;
    background:#3A342C;
  }

  .details{
    margin-top:32px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .details .row{
    display:flex;
    align-items:flex-start;
    gap:14px;
    font-size:23px;
    font-weight:500;
    color:#D9D2C6;
  }
  .details svg{flex:none;margin-top:4px;color:var(--yellow);}
  .details b{color:var(--paper);font-weight:700;}

  .cta{
    margin-top:auto;
    padding-top:30px;
    display:inline-flex;
    align-items:center;
    gap:16px;
    background:var(--paper);
    color:var(--ink);
    padding:18px 30px;
    border-radius:10px;
    width:fit-content;
  }
  .cta svg{flex:none;color:var(--red);}
  .cta .label2{
    font-weight:700;
    font-size:26px;
  }
  .cta .num{
    font-weight:700;
    font-size:26px;
    color:var(--red);
  }

  .croc{
    position:absolute;
    right:64px;
    bottom:64px;
    opacity:0.9;
  }
</style>
</head>
<body>

  <div class="brand">
    <span class="label">Le Maï-Taï</span>
    <span class="dot"></span>
    <span class="place">By Croc Parc</span>
  </div>

  <div class="headline-wrap">
    <div class="stamp"><h1>On<br>rouvre</h1></div>
    <div class="date">Mardi 18 août</div>
  </div>

  <div class="rule"></div>

  <div class="details">
    <div class="row">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2.2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <div>Ouvert <b>du mardi au vendredi</b> — fermé le lundi</div>
    </div>
    <div class="row">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v5l3.2 2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <div><b>Samedi &amp; dimanche</b> sur réservation — entrée principale CrocParc</div>
    </div>
    <div class="row">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <div>Menu à <b>26&nbsp;€</b> — entrée, plat, dessert — places limitées</div>
    </div>
  </div>

  <div class="cta">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.7 21 3 13.3 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z" fill="currentColor"/></svg>
    <span class="label2">Réservations</span>
    <span class="num">06 92 39 42 00</span>
  </div>

  <svg class="croc" width="120" height="60" viewBox="0 0 120 60" fill="none">
    <path d="M4 40c10-14 26-22 44-22 14 0 22 5 30 5 8 0 10-6 18-6 8 0 14 6 20 6-6 6-14 9-22 9-3 5-9 9-16 9-4 6-11 10-19 10-16 0-27-4-40-4-6 0-11 1-15-7z" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
    <circle cx="86" cy="19" r="2.4" fill="currentColor"/>
    <path d="M20 40l-3 8M32 41l-2 8M44 41l-1 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </svg>

</body>
</html>
