<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le Maï-Taï — Annonce animée (Reel / Story)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,900;1,600&family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../shared/design-tokens.css">
<style>

  /* ============================================================
     À MODIFIER — contenu de cette annonce animée
     Identique au template Annonce statique : mêmes variables.
     ============================================================ */
  :root{
    --mt-kicker:"Après les vacances scolaires";
    --mt-titre:"Nou artourne !";
    --mt-date:"Mardi 18 août";
    --mt-detail-1:"Ouvert du mardi au vendredi — fermé le lundi";
    --mt-detail-2:"Samedi & dimanche sur réservation — entrée principale CrocParc";
    --mt-detail-3:"Menu à 26 € — entrée, plat, dessert — places limitées";
    --mt-cta-label:"Réservations";
    --mt-cta-num:"06 92 39 42 00";
    --mt-photo:url('../../../assets/source/venue-terrasse-original.jpg');
  }
  /* ============================================================ */

  html,body{width:1080px;height:1920px;display:flex;flex-direction:column;}

  .photo-band{position:relative;width:1080px;height:840px;overflow:hidden;flex:none;}
  .photo-band .photo{
    position:absolute;inset:-4%;
    background-image:var(--mt-photo);
    background-size:cover;
    background-position:50% 18%;
    filter:saturate(1.2) contrast(1.05) brightness(1.03);
    animation:kenburns 9s ease-out forwards;
  }
  .photo-band .tint{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(200,155,60,0.10) 0%, rgba(200,155,60,0.02) 30%, rgba(181,67,43,0.28) 100%);
    mix-blend-mode:multiply;
  }
  .photo-band .fade-bottom{
    position:absolute;left:0;right:0;bottom:0;height:260px;
    background:linear-gradient(180deg, rgba(245,238,223,0) 0%, var(--color-cream) 92%);
  }
  .mt-logo{
    position:absolute;top:44px;left:56px;z-index:5;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,0.45));
    opacity:0;
    animation:fadeDown 0.7s ease-out 0.15s forwards;
  }

  .panel{position:relative;padding:0 var(--space-xl);color:var(--color-brown-dark);overflow:hidden;}
  .kicker{
    font-family:var(--font-label);font-weight:700;font-size:var(--text-kicker);
    letter-spacing:4px;text-transform:uppercase;color:var(--color-terracotta);
    margin-top:14px;
    opacity:0;
    animation:fadeUp 0.6s ease-out 0.55s forwards;
  }
  .kicker::before{content:var(--mt-kicker);}
  .mt-headline{opacity:0;animation:popIn 0.65s cubic-bezier(.2,1.4,.4,1) 0.9s forwards;}
  h1{
    font-family:var(--font-display);font-weight:900;font-style:italic;
    font-size:var(--text-headline);line-height:0.94;letter-spacing:-1.5px;
    margin-top:8px;
    max-width:960px;
  }
  h1::before{content:var(--mt-titre);}
  .scribble{width:230px;height:17px;margin-top:0;margin-left:4px;}
  .scribble path{
    stroke-dasharray:320;
    stroke-dashoffset:320;
    animation:draw 0.7s ease-out 1.6s forwards;
  }
  .mt-sticker{
    margin-top:16px;
    opacity:0;
    transform:scale(0.4) rotate(-3deg);
    animation:stickerPop 0.6s cubic-bezier(.3,1.7,.4,1) 2.2s forwards, pulse 1.1s ease-in-out 2.9s infinite;
  }
  .mt-sticker::before{content:var(--mt-date);}

  .details{margin-top:24px;display:flex;flex-direction:column;gap:10px;}
  .details .mt-row{opacity:0;animation:fadeUp 0.5s ease-out forwards;}
  .details .mt-row:nth-child(1){animation-delay:2.75s;}
  .details .mt-row:nth-child(2){animation-delay:3.0s;}
  .details .mt-row:nth-child(3){animation-delay:3.25s;}
  .detail-1::before{content:var(--mt-detail-1);}
  .detail-2::before{content:var(--mt-detail-2);}
  .detail-3::before{content:var(--mt-detail-3);}

  .mt-cta{
    margin-top:20px;
    opacity:0;
    transform:scale(0.7);
    animation:ctaPop 0.5s cubic-bezier(.3,1.7,.4,1) 3.65s forwards, pulse 1.1s ease-in-out 4.4s infinite;
  }
  .mt-cta-label::before{content:var(--mt-cta-label);}
  .mt-cta-num::before{content:var(--mt-cta-num);}

  @keyframes kenburns{
    from{transform:scale(1.08);}
    to{transform:scale(1);}
  }
  @keyframes fadeDown{
    from{opacity:0;transform:translateY(-16px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(18px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes popIn{
    from{opacity:0;transform:scale(0.85);}
    to{opacity:1;transform:scale(1);}
  }
  @keyframes draw{
    to{stroke-dashoffset:0;}
  }
  @keyframes stickerPop{
    0%{opacity:0;transform:scale(0.4) rotate(-3deg);}
    70%{opacity:1;transform:scale(1.08) rotate(-3deg);}
    100%{opacity:1;transform:scale(1) rotate(-3deg);}
  }
  @keyframes ctaPop{
    0%{opacity:0;transform:scale(0.7);}
    70%{opacity:1;transform:scale(1.05);}
    100%{opacity:1;transform:scale(1);}
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(181,67,43,0.45);}
    50%{box-shadow:0 0 0 14px rgba(181,67,43,0);}
  }

  /* La chronologie ne démarre qu'une fois les polices chargées (classe
     "ready" posée par le script en bas de page) — sinon le délai des
     animations tourne pendant le chargement réseau et le rendu capturé
     en vidéo ne correspond plus à la chorégraphie prévue. */
  .photo-band .photo,
  .mt-logo,
  .kicker,
  .mt-headline,
  .scribble path,
  .mt-sticker,
  .details .mt-row,
  .mt-cta{
    animation-play-state:paused;
  }
  body.ready .photo-band .photo,
  body.ready .mt-logo,
  body.ready .kicker,
  body.ready .mt-headline,
  body.ready .scribble path,
  body.ready .mt-sticker,
  body.ready .details .mt-row,
  body.ready .mt-cta{
    animation-play-state:running;
  }
</style>
</head>
<body data-format="story">

  <div class="mt-safe-band top">
    <svg width="140" height="18" viewBox="0 0 140 18" fill="none">
      <path d="M0 9h50M90 9h50" stroke="#F5EEDF" stroke-width="2"/>
      <path d="M63 2 L60 16" stroke="#F5EEDF" stroke-width="4" stroke-linecap="round"/>
      <path d="M77 2 L80 16" stroke="#F5EEDF" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="photo-band">
    <div class="photo"></div>
    <div class="tint"></div>
    <div class="fade-bottom"></div>

    <div class="mt-logo">
      <div class="mt-logo-row">
        <svg class="bamboo" width="14" height="62" viewBox="0 0 14 62" fill="none">
          <path d="M7 2 L5 60" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <path d="M1 18 L13 15" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M0 40 L12 37" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <div class="logo-text">
          <span class="maitai">Maï-Taï</span>
          <span class="restaurant">RESTAURANT</span>
        </div>
        <svg class="bamboo" width="14" height="62" viewBox="0 0 14 62" fill="none">
          <path d="M7 2 L9 60" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <path d="M13 18 L1 15" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M14 40 L2 37" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="mt-logo-croc">
        <svg class="croc-mini" width="70" height="18" viewBox="0 0 120 30" fill="currentColor">
          <ellipse cx="58" cy="16" rx="42" ry="7"/>
          <polygon points="18,16 0,10 0,22"/>
          <polygon points="98,16 120,11 120,21"/>
          <polygon points="34,9 39,1 44,9"/>
          <polygon points="50,9 55,1 60,9"/>
          <polygon points="66,9 71,1 76,9"/>
          <rect x="30" y="21" width="3" height="7" rx="1"/>
          <rect x="42" y="22" width="3" height="7" rx="1"/>
          <rect x="72" y="22" width="3" height="7" rx="1"/>
          <rect x="84" y="21" width="3" height="7" rx="1"/>
        </svg>
        <span>By Croc Parc</span>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="mt-grain"></div>
    <div class="kicker"></div>
    <div class="mt-headline">
      <div class="halo"></div>
      <h1 class="mt-pop-shadow"></h1>
      <svg class="scribble" viewBox="0 0 230 17" fill="none"><path d="M3 10c22-9 44-9 60-3s38 8 60 1 49-7 65 1 27 3 37-2" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg>
    </div>
    <div class="mt-sticker"></div>

    <div class="details">
      <div class="mt-row">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2.2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span class="detail-1"></span>
      </div>
      <div class="mt-row">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v5l3.2 2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span class="detail-2"></span>
      </div>
      <div class="mt-row">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span class="detail-3"></span>
      </div>
    </div>

    <div class="mt-cta">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.7 21 3 13.3 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z" fill="currentColor"/></svg>
      <span class="mt-cta-label"></span>
      <span class="mt-cta-num"></span>
    </div>
  </div>

  <div class="mt-safe-band bottom" style="margin-top:auto;">
    <svg width="140" height="18" viewBox="0 0 140 18" fill="none">
      <path d="M0 9h50M90 9h50" stroke="#F5EEDF" stroke-width="2"/>
      <path d="M63 2 L60 16" stroke="#F5EEDF" stroke-width="4" stroke-linecap="round"/>
      <path d="M77 2 L80 16" stroke="#F5EEDF" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>

  <script>
    document.fonts.ready.then(function(){ document.body.classList.add('ready'); });
  </script>
</body>
</html>
