<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le Maï-Taï — Template Menu du jour / Plat — Carré</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,900;1,600&family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/design-tokens.css">
<style>

  /* ============================================================
     À MODIFIER — contenu de cette publication "Menu du jour"
     Remplacez le texte entre guillemets " ".
     Pour la photo : remplacez l'URL entre parenthèses par
     url('./chemin/vers/votre-photo.jpg'), PUIS supprimez le bloc
     ".photo-placeholder-label" plus bas dans le fichier HTML
     (repérable par le commentaire "SUPPRIMER SI PHOTO RÉELLE").
     ============================================================ */
  :root{
    --mt-kicker:"Suggestion du jour";
    --mt-plat:"Mahi-Mahi Grillé";
    --mt-description:"Riz façon pilaf, légumes rôtis";
    --mt-prix:"26 €";
    --mt-cta-label:"Réservations";
    --mt-cta-num:"06 92 39 42 00";
    --mt-photo:linear-gradient(135deg, #CBB89A 0%, #A9714A 100%);
  }
  /* ============================================================ */

  html,body{width:1080px;height:1080px;}

  .photo-band{position:relative;width:1080px;height:620px;overflow:hidden;}
  .photo-band .photo{
    position:absolute;inset:0;
    background-image:var(--mt-photo);
    background-size:cover;
    background-position:center;
  }
  .photo-band .fade-bottom{
    position:absolute;left:0;right:0;bottom:0;height:220px;
    background:linear-gradient(180deg, rgba(245,238,223,0) 0%, var(--color-cream) 92%);
  }
  .mt-logo{position:absolute;top:48px;left:56px;z-index:5;filter:drop-shadow(0 2px 10px rgba(0,0,0,0.45));}

  /* Repère visuel tant qu'aucune photo réelle n'est renseignée — SUPPRIMER SI PHOTO RÉELLE */
  .photo-placeholder-label{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;color:rgba(245,238,223,0.85);
  }
  .photo-placeholder-label span{
    font-family:var(--font-label);font-weight:700;font-size:18px;
    letter-spacing:4px;text-transform:uppercase;
  }

  .price-badge{
    position:absolute;right:56px;top:582px;z-index:6;
    background:var(--color-terracotta);color:var(--color-cream);
    width:120px;height:120px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(36,25,17,0.35);
    font-family:var(--font-label);font-weight:700;font-size:30px;
  }
  .price-badge::before{content:var(--mt-prix);}

  .panel{position:relative;padding:0 var(--space-xl);color:var(--color-brown-dark);margin-top:64px;}
  .kicker{
    font-family:var(--font-label);font-weight:700;font-size:var(--text-kicker);
    letter-spacing:4px;text-transform:uppercase;color:var(--color-terracotta);
  }
  .kicker::before{content:var(--mt-kicker);}
  h1{
    font-family:var(--font-display);font-weight:900;font-style:italic;
    font-size:104px;line-height:0.92;letter-spacing:-1px;
    margin-top:10px;
    max-width:840px;
  }
  h1::before{content:var(--mt-plat);}
  .description{
    font-family:var(--font-body);font-weight:500;font-size:26px;
    color:var(--color-brown-mid);margin-top:16px;max-width:760px;
  }
  .description::before{content:var(--mt-description);}

  .mt-cta{margin-top:40px;}
  .mt-cta-label::before{content:var(--mt-cta-label);}
  .mt-cta-num::before{content:var(--mt-cta-num);}
</style>
</head>
<body>

  <div class="photo-band">
    <div class="photo"></div>

    <!-- SUPPRIMER SI PHOTO RÉELLE -->
    <div class="photo-placeholder-label">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.4"/></svg>
      <span>Photo du plat</span>
    </div>
    <!-- /SUPPRIMER SI PHOTO RÉELLE -->

    <div class="fade-bottom"></div>

    <div class="mt-logo">
      <svg class="bamboo" width="14" height="62" viewBox="0 0 14 62" fill="none">
        <path d="M7 2 L5 60" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
        <path d="M1 18 L13 15" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M0 40 L12 37" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <div class="logo-text">
        <span class="maitai">Maï-Taï</span>
        <span class="restaurant">RESTAURANT</span>
      </div>
      <svg class="bamboo" width="14" height="62" viewBox="0 0 14 62" fill="none">
        <path d="M7 2 L9 60" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
        <path d="M13 18 L1 15" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M14 40 L2 37" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="price-badge"></div>

  <div class="panel">
    <div class="kicker"></div>
    <h1></h1>
    <div class="description"></div>

    <div class="mt-cta">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.7 21 3 13.3 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z" fill="currentColor"/></svg>
      <span class="mt-cta-label"></span>
      <span class="mt-cta-num"></span>
    </div>
  </div>

</body>
</html>
