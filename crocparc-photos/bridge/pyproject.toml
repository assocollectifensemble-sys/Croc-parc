[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crocparc-bridge"
version = "0.1.0"
description = "Pont local Croc Parc Photos : FTP Sony A7 IV -> tri par carte QR -> previews filigranees -> stockage"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "pyzbar>=0.1.9",
    "watchdog>=3.0",
]

[project.optional-dependencies]
# Phase B : upload R2. Non utilise en phase A.
cloud = ["boto3>=1.34"]
# Generation des fixtures de test (cartes QR synthetiques).
dev = ["pytest>=8.0", "qrcode>=7.4"]

[project.scripts]
crocparc-bridge = "bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:bridge.*"]
