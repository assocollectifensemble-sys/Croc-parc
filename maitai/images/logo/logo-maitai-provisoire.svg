<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Le Maï-Taï by Croc Parc (logo provisoire)">
  <!-- LOGO PROVISOIRE — à remplacer par le logo officiel fourni par le client.
       Voir README.md § « Remplacer les images ». Ne pas retravailler ce fichier. -->
  <defs>
    <linearGradient id="mt-feuille" x1="20%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#7FA86A"/>
      <stop offset="100%" stop-color="#3B6B4A"/>
    </linearGradient>
  </defs>

  <!-- Galet / feuille : reprend le rayon organique de la charte -->
  <path d="M64 6c32 0 58 24 58 55 0 34-27 61-58 61S6 95 6 61C6 30 32 6 64 6z"
        fill="#17281D"/>
  <path d="M64 14c27 0 49 20 49 46 0 29-23 52-49 52s-49-23-49-52c0-26 22-46 49-46z"
        fill="url(#mt-feuille)" opacity=".16"/>

  <!-- Nervure centrale + folioles : une feuille de filao stylisée -->
  <g stroke="#7FA86A" stroke-linecap="round" fill="none">
    <path d="M64 104V32" stroke-width="5"/>
    <path d="M64 46c-9-9-19-12-27-11 1 9 6 17 15 21 5 2 9 2 12 1" stroke-width="4"/>
    <path d="M64 46c9-9 19-12 27-11-1 9-6 17-15 21-5 2-9 2-12 1" stroke-width="4"/>
    <path d="M64 70c-8-8-17-11-24-10 1 8 5 15 13 19 5 2 8 2 11 1" stroke-width="4"/>
    <path d="M64 70c8-8 17-11 24-10-1 8-5 15-13 19-5 2-8 2-11 1" stroke-width="4"/>
  </g>

  <!-- Monogramme MT posé sur la nervure -->
  <text x="64" y="34" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700"
        fill="#F7F2E7" letter-spacing="1">MT</text>
</svg>
